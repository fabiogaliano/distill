# Library root: books/<slug>/ and skills/<name>/ live here
library: ~/Core/library

# Model roles. --model <role> overrides every stage for one run.
models:
  opus:      { provider: claude-sdk, model: claude-opus-5-5, effort: medium }
  opus-low:  { provider: claude-sdk, model: claude-opus-5-5, effort: low }
  opus-high: { provider: claude-sdk, model: claude-opus-5-5, effort: high }
  flash:     { provider: agy, model: gemini-3.5-flash-medium }
  pro:       { provider: agy, model: gemini-3.1-pro-low }

# Which role each stage uses
stages:
  extract: opus      # opus-low if quota bites, opus-high if quota is plentiful
  synthesize: opus
  skill: opus

# Parallel model calls per book (and eval runs per skill); subscriptions rate-limit bursts
concurrency: 4

skills:
  # One SKILL.md per target, written with that model's prompting guide
  targets:
    claude:
      reader: Claude Opus 5.5 and Fable 5.1 in Claude Code
      guide: guides/claude-opus-5-5.md
      install: ~/.claude/skills
    gpt:
      reader: GPT-6 Astra in the pi coding agent
      guide: guides/gpt-6-astra.md
      install: ~/.pi/agent/skills
  # Gate: claude plugin eval, with-skill vs no-skill, on the recipe's cases
  eval:
    target: claude
    runs: 3            # per case and arm; fewer makes the score noise
    threshold: 0.8     # every case's with-skill score must reach this
    attempts: 3        # eval → revise spec rounds before handing back to you
    judge: sonnet      # a different model from the one under test

prompts:
  # Model-picked with this prompt: evals/model-pick/ (keep them in sync when changing it)
  extract: |
      You are extracting the durable knowledge from one chapter of a technical book. The output feeds three uses: a reader skimming the book, Anki flashcards, and a Claude skill that applies the book's ideas to real work. Capture what a practitioner would need to recognize and apply the ideas, not a retelling of the chapter.

      Book: {{BOOK}}
      Chapter: {{CHAPTER}}

      The chapter text follows these instructions.

      Respond with a single JSON object and nothing else, matching this shape:

      {
        "skip": false,
        "summary": "3-6 sentences: the chapter's main argument and why it matters",
        "concepts": [{ "name": "term as the author names it", "definition": "", "why_it_matters": "" }],
        "principles": [{ "statement": "", "explanation": "" }],
        "red_flags": [{ "name": "", "symptom": "how you notice it in real code or work", "fix": "" }],
        "techniques": [{ "name": "", "steps": [""], "when_to_use": "" }],
        "contrasts": [{ "a": "", "b": "", "difference": "", "when_to_pick": "" }],
        "examples": [{ "description": "", "illustrates": "which concept or principle" }],
        "cards": [{ "type": "concept | contrast | red_flag | scenario | code", "front": "", "back": "" }]
      }

      Rules:
      - Use the author's own names for concepts, principles, and red flags. Don't rename or merge them.
      - Only include what the chapter supports. An empty array is fine; an invented item is not.
      - Each list item stands alone: someone reading only that item understands it.
      - Cards test understanding, not recall of wording. Prefer scenario cards ("a method only forwards its arguments to another method — what's wrong and how do you fix it?") and contrast cards over definition cards. No cloze. Code cards only if the chapter's point depends on code. One idea per card; answers under 60 words.
      - Write 5-12 cards, scaled to how much the chapter teaches.
      - If the chapter has no teachable content (copyright, acknowledgments, index, author bio), respond with {"skip": true} only.

  synthesize: |
      You are writing the overview that opens a reading summary of one book. The chapter-by-chapter notes follow it in the same document, so the overview's job is the view across chapters: what the book argues and how its ideas fit together.

      Book: {{BOOK}}
      Author: {{AUTHOR}}

      The structured notes for every chapter follow these instructions, as JSON.

      Write the overview in Markdown, 500-900 words:
      - Open with the book's central argument in two or three sentences.
      - Then the few ideas that carry the book, each under a ### heading, in the order they build on each other. Say where ideas from different chapters depend on or refine each other.
      - End with a ### Where it applies section: concrete situations in real work where these ideas change what you would do.

      Rules:
      - Use the author's names for concepts, principles, and red flags, exactly as they appear in the notes.
      - Only state what the notes support.
      - Don't walk through the chapters in order, and don't restate each chapter's summary.
      - Start directly with the argument: no title, no "This book…" or "In this book…" opener, no closing recap paragraph.

  # Input: the library catalog (each synthesized book's overview and chapters),
  # then any previous recipe with feedback on it
  skill_plan: |
      You are planning an agent skill built from books in a reading library. A skill is a SKILL.md file that Claude Code (and GPT in the pi agent) loads when a task matches its description, so the agent applies the books' ideas while doing real work. The skill's working name is "{{NAME}}". The library catalog follows these instructions: for each book, its slug, overview, and chapter list (index: title). If a previous recipe and feedback on it follow the catalog, revise that recipe to address the feedback.

      Propose the recipe:
      - description: what the agent reads when deciding whether to load the skill. Third person, under 600 characters: what the skill does, then "Use when…" with the concrete situations that should trigger it (kinds of task, what the user asks for). Specific enough that it doesn't fire on every loosely related request.
      - focus: one paragraph on what the skill makes the agent do differently from a strong model without it, and what it leaves out.
      - sources: the books (by slug) the skill draws on. Add "chapters" (a list of indices) only when a book is relevant in part; omit it to use the whole book.
      - scope: "include" and "exclude", short lists of topics.
      - evals: 5-7 test cases for an eval that runs each prompt with and without the skill. At least 4 where the skill should fire, covering at least two different kinds of request (for example: review this code, design this, decide between these options, explain why this is a problem), and 1-2 realistic near-misses where it should not fire. Each case:
        - name: a kebab-case slug.
        - fire: true or false.
        - prompt: what a real user would type, with any code or context written out in full. It runs in an empty directory, so never refer to files or paths.
        - expect: 2-4 statements a judge can check by reading only the final response. Make them concrete (e.g. "Identifies that both classes encode the file format, and names this information leakage"). For fire cases, test what the books add over a generic good answer, so that a strong model without the skill fails at least one. For no-fire cases, check that the response answers the actual request without steering it into the books' framework.

      Only use books from the catalog. Respond with a JSON object only:
      {"description": "…", "focus": "…", "sources": [{"book": "…", "chapters": [1, 2]}], "scope": {"include": ["…"], "exclude": ["…"]}, "evals": [{"name": "…", "fire": true, "prompt": "…", "expect": ["…"]}]}

  # Agentic, with read access to the source books and write access to spec.md only
  skill_spec: |
      Write the source spec for an agent skill named "{{NAME}}". Renderers turn this one model-neutral spec into a SKILL.md for Claude and one for GPT, so it holds the content, not the wording for either model.

      The approved recipe:

      {{RECIPE}}

      Sources, readable with your tools:

      {{SOURCES}}

      Start from each book's summary.md and the chapter extraction JSON files (concepts, principles, red flags, techniques, contrasts, examples). Open chapter text only when you need an example or more detail than the extraction has.

      Write {{SPEC_PATH}} in Markdown with these sections:
      - When to use: the situations from the recipe's description and scope, and near-misses where the skill does not apply.
      - Procedure: for each kind of request the skill handles, how the agent works through it and what its answer contains.
      - Concepts and red flags: each named idea from the books that the skill applies, with the author's name for it, how to recognize it in code or in a situation, why it matters, and the fix or alternative.
      - Examples: two or three short worked examples, from the books where possible, each showing a situation and how the skill handles it.
      - Pitfalls: specific mistakes an agent makes in this domain without the skill.

      Write for an agent doing the work, not for a reader of the book: no chapter-by-chapter summary, no book history, no praise. Keep the author's terms. Stay inside the recipe's scope. Aim for 150-350 lines.

  # Same access as skill_spec; the eval gate's failures follow the recipe
  skill_revise: |
      The skill "{{NAME}}" failed its eval gate. Its spec, {{SPEC_PATH}}, was written from this recipe:

      {{RECIPE}}

      Sources, readable with your tools:

      {{SOURCES}}

      Each failing case below was run several times with the skill loaded; it lists the prompt, the checks the runs missed, the judge's reason, and the start of the agent's response.

      {{FAILURES}}

      Edit {{SPEC_PATH}} so that an agent using it would pass these checks on requests like these, not only on these exact prompts. Work out why each check was missed: missing content (add it from the sources), content the agent didn't apply (make the procedure call for it), or guidance that led it astray (fix it). If a check looks wrong or unfair given the recipe, leave the spec as it is for that check and say so in your final line. Keep changes targeted, and keep everything that isn't implicated.

  # Input: spec.md. {{GUIDE}} is the target model's prompting guide from guides/
  skill_render: |
      Render the skill spec that follows these instructions into the body of a SKILL.md read by {{READER}}. The frontmatter (name and description) is added separately, so output only the Markdown body, starting with a "# " title line.

      Keep every procedure step, named concept, red flag, fix, and example from the spec. Change the wording, order, and structure to fit how this reader follows instructions, according to this guide:

      <guide>
      {{GUIDE}}
      </guide>

      Output the SKILL.md body only, with no preface and no code fence around it.
